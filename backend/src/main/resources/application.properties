# ---- Server ----
server.port=8080

# ---- SQLite datasource ----
# File-based SQLite DB stored in the backend working directory.
spring.datasource.url=jdbc:sqlite:salary.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---- JPA / Hibernate ----
# Community SQLite dialect (Hibernate core has no built-in SQLite dialect).
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Logging ----
logging.level.org.hibernate.SQL=INFO

# ---- App: simple API security ----
# Single HR persona. A static API token guards write/analytics endpoints.
# Overridable via env var APP_API_TOKEN in real deployments.
app.security.api-token=${APP_API_TOKEN:dev-hr-token}

# ---- App: seeding ----
# When true (and DB empty), the seeder generates 10,000 employees deterministically.
app.seed.enabled=true
app.seed.employee-count=10000
app.seed.random-seed=42
